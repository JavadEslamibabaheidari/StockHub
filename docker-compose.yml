services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockhub}
      POSTGRES_USER: ${POSTGRES_USER:-stockhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockhub-local-only}
    volumes:
      - stockhub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  stockhub:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-stockhub};Username=${POSTGRES_USER:-stockhub};Password=${POSTGRES_PASSWORD:-stockhub-local-only}
      Database__ApplyMigrations: "true"
      Authentication__SecureCookies: "false"
    ports:
      - "${STOCKHUB_PORT:-8080}:8080"

volumes:
  stockhub-postgres:
