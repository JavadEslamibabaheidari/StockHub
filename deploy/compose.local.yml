services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockhub
      POSTGRES_USER: stockhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockhub -d stockhub"]
      interval: 5s
      timeout: 5s
      retries: 12
  stockhub:
    image: ${STOCKHUB_IMAGE:?Set STOCKHUB_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=stockhub;Username=stockhub;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      Database__ApplyMigrations: "false"
      Authentication__SecureCookies: ${AUTHENTICATION_SECURE_COOKIES:-false}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Application__PublicBaseUrl: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL}
      Email__Smtp__Host: ${SMTP_HOST:-}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__From: ${SMTP_FROM:-}
      Email__Smtp__Username: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__Smtp__UseTls: ${SMTP_USE_TLS:-true}
    ports:
      - "127.0.0.1:${STOCKHUB_PORT:?Set STOCKHUB_PORT}:8080"
    volumes:
      - data-protection:/home/app/.aspnet/DataProtection-Keys
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

volumes:
  postgres-data:
  data-protection:
