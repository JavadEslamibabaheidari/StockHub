apiVersion: batch/v1
kind: Job
metadata:
  name: __MIGRATION_JOB__
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: __STOCKHUB_IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["dotnet", "StockHub.Api.dll", "--migrate-only"]
          env:
            - name: ConnectionStrings__Postgres
              valueFrom:
                secretKeyRef:
                  name: stockhub-runtime
                  key: postgres-connection
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data-protection
              mountPath: /home/app/.aspnet/DataProtection-Keys
      volumes:
        - name: data-protection
          emptyDir: {}
