apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockhub
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stockhub
  template:
    metadata:
      labels:
        app: stockhub
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stockhub
          image: __STOCKHUB_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: Database__ApplyMigrations
              value: "false"
            - name: ConnectionStrings__Postgres
              valueFrom:
                secretKeyRef:
                  name: stockhub-runtime
                  key: postgres-connection
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data-protection
              mountPath: /home/app/.aspnet/DataProtection-Keys
      volumes:
        - name: data-protection
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: stockhub
spec:
  selector:
    app: stockhub
  ports:
    - name: http
      port: 80
      targetPort: http
