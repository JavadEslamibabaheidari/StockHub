apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockhub
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stockhub
  template:
    metadata:
      labels:
        app: stockhub
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stockhub
          image: __STOCKHUB_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: Database__ApplyMigrations
              value: "false"
            - name: ConnectionStrings__Postgres
              valueFrom:
                secretKeyRef:
                  name: stockhub-runtime
                  key: postgres-connection
            - name: Authentication__Google__ClientId
              valueFrom:
                secretKeyRef:
                  name: stockhub-runtime
                  key: google-client-id
                  optional: true
            - name: Authentication__Google__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: stockhub-runtime
                  key: google-client-secret
                  optional: true
            - name: Application__PublicBaseUrl
              valueFrom:
                secretKeyRef:
                  name: stockhub-runtime
                  key: public-base-url
                  optional: true
            - name: Email__Smtp__Host
              valueFrom:
                secretKeyRef:
                  name: stockhub-runtime
                  key: smtp-host
                  optional: true
            - name: Email__Smtp__Port
              valueFrom:
                secretKeyRef:
                  name: stockhub-runtime
                  key: smtp-port
                  optional: true
            - name: Email__Smtp__From
              valueFrom:
                secretKeyRef:
                  name: stockhub-runtime
                  key: smtp-from
                  optional: true
            - name: Email__Smtp__Username
              valueFrom:
                secretKeyRef:
                  name: stockhub-runtime
                  key: smtp-username
                  optional: true
            - name: Email__Smtp__Password
              valueFrom:
                secretKeyRef:
                  name: stockhub-runtime
                  key: smtp-password
                  optional: true
            - name: Email__Smtp__UseTls
              value: "true"
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data-protection
              mountPath: /home/app/.aspnet/DataProtection-Keys
            - name: temp
              mountPath: /tmp
      volumes:
        - name: data-protection
          emptyDir: {}
        - name: temp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: stockhub
spec:
  selector:
    app: stockhub
  ports:
    - name: http
      port: 80
      targetPort: http
