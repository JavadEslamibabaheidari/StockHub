name: Repository sanity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-sanity:
    name: Repository sanity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check whitespace errors
        run: git diff --check

      - name: Check required planning artifact
        run: test -f docs/plans/github-infrastructure-plan.md

      - name: Check milestone closure script
        run: test -x scripts/check-milestone-closure.sh
