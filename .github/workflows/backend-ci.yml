name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'StockHub.sln'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'StockHub.sln'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Restore dependencies
        run: dotnet restore StockHub.sln
      - name: Build
        run: dotnet build StockHub.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test StockHub.sln --no-build --configuration Release --verbosity normal
      - name: Validate migration exists
        run: test -s backend/database/migrations/001_access.sql
