name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stockhub
          POSTGRES_USER: stockhub
          POSTGRES_PASSWORD: stockhub-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockhub -d stockhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      STOCKHUB_POSTGRES_TEST_CONNECTION: Host=localhost;Port=5432;Database=stockhub;Username=stockhub;Password=stockhub-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x
      - name: Restore dependencies
        run: dotnet restore StockHub.sln
      - name: Build
        run: dotnet build StockHub.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test StockHub.sln --no-build --configuration Release --verbosity normal
      - name: Validate migration exists
        run: test -s backend/database/migrations/001_access.sql
