name: Milestone closure

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/reports/**'
      - 'docs/ai-development-workflow.md'
      - 'scripts/check-milestone-closure.sh'
      - 'scripts/check-tracking-status.sh'

permissions:
  contents: read

jobs:
  closure-report:
    name: Validate milestone closure evidence
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate closure reports
        id: report
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d docs/reports ]]; then
            echo "No milestone closure report in this pull request; skipping closure validation."
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t reports < <(find docs/reports -maxdepth 1 -type f -name 'milestone-*-closure.md' -print 2>/dev/null | sort)
          if [[ "${#reports[@]}" -eq 0 ]]; then
            echo "No milestone closure report in this pull request; skipping closure validation."
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo 'paths<<EOF'
            printf '%s\n' "${reports[@]}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Run closure gate
        if: steps.report.outputs.paths != ''
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r report; do
            [[ -n "$report" ]] || continue
            if grep -Eq '^status:[[:space:]]*PASS[[:space:]]*$' "$report"; then
              bash scripts/check-milestone-closure.sh "$report"
            else
              echo "Closure report is not PASS; final closure validation is deferred: $report"
            fi
          done <<< '${{ steps.report.outputs.paths }}'
