name: Container quality and image publishing

on:
  pull_request:
  push:
    branches: [dev]
    tags: ['v0.*.0']
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  container-quality:
    name: Image scan and Compose smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t stockhub:ci .
      - name: Scan image and write SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: stockhub:ci
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
      - name: Report vulnerabilities to code scanning
        if: always() && hashFiles('trivy-results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
      - name: Block critical and high image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: stockhub:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Compose build, health, and route smoke
        run: bash scripts/check-compose-smoke.sh

  publish:
    if: github.event_name == 'push'
    name: Validate release and publish immutable image
    needs: container-quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify milestone tag and closure
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/check-release-tag.sh "$RELEASE_TAG"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Resolve source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and publish immutable image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.source.outputs.sha }}
      - name: Scan published digest before deployment
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
