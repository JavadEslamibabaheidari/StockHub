name: Container smoke

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/check-compose-smoke.sh'
      - '.github/workflows/container-ci.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/check-compose-smoke.sh'
      - '.github/workflows/container-ci.yml'

permissions:
  contents: read

jobs:
  smoke:
    name: Compose build and same-origin smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run Compose smoke test
        run: bash scripts/check-compose-smoke.sh
