name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-sanity:
    name: Repository sanity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whitespace errors
        run: git diff --check

      - name: Check required planning artifact
        run: test -f docs/plans/github-infrastructure-plan.md

      # Runtime-specific build, test, and lint commands belong here after the
      # product/architecture track selects the application stack.
